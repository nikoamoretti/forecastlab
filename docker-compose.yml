services:
  api:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./:/app
    command: bash -lc "pip install -e . && uvicorn forecastlab_api.main:app --host 0.0.0.0 --port 8765"
    ports:
      - "8765:8765"
    environment:
      FORECASTLAB_DATABASE_URL: sqlite:////app/data/forecastlab.db
  worker:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./:/app
    command: bash -lc "pip install -e . && python -m forecastlab_api.worker"
    environment:
      FORECASTLAB_DATABASE_URL: sqlite:////app/data/forecastlab.db
  web:
    image: node:22-slim
    working_dir: /app/apps/web
    volumes:
      - ./:/app
    command: bash -lc "npm install && npm run dev -- --hostname 0.0.0.0 --port 3000"
    ports:
      - "3000:3000"
