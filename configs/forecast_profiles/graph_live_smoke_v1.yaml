id: graph_live_smoke_v1
version: 3
label: Graph live smoke V1
description: Tightly bounded live execution profile that exercises the complete graph forecasting path. It is not an evaluation or production-quality profile.
execution_strategy: graph_nodes
graph_generation_enabled: true
evidence_claims_enabled: true
node_forecasting_enabled: true
graph_aggregation_enabled: true
tracks:
  - single_agent
subquestions_per_track: 1
search_results_per_subquestion: 2
fetches_per_subquestion: 1
aggregation_method: importance_weighted_log_odds_v1
shrinkage: 0.0
max_model_calls: 14
max_search_calls: 4
max_fetched_documents: 8
max_tokens: 50000
max_output_tokens_per_call: 1536
graph_generation_max_completion_tokens: 8192
graph_generation_max_visible_output_tokens: 1536
graph_generation_reasoning_effort: minimal
graph_generation_verbosity: low
graph_generation_transport: compact_indexed_v1
graph_generation_transport_max_characters: 4200
graph_generation_node_question_max_characters: 140
graph_generation_local_id_max_characters: 16
graph_generation_max_dependencies_per_node: 3
graph_generation_max_preferred_sources_per_node: 2
graph_generation_preferred_source_max_characters: 48
max_candidate_fetch_attempts_per_node: 2
search_candidate_pool_per_node: 5
prefer_distinct_candidate_hosts: true
max_estimated_cost_usd: 0.50
max_wall_clock_seconds: 300
prompt_versions:
  forecast_graph: v1
  graph_research: v1
  evidence_claims: v1
  forecast_node: v3
