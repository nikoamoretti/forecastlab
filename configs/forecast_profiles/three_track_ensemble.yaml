id: three_track_ensemble
version: 1
label: Three-track ensemble
description: Independent base-rate, current-evidence, and skeptic tracks with coded logit aggregation.
tracks:
  - base_rate
  - current_evidence
  - skeptic
subquestions_per_track: 4
search_results_per_subquestion: 3
fetches_per_subquestion: 2
aggregation_method: equal_weight_logit_shrinkage
shrinkage: 0.10
max_model_calls: 40
max_search_calls: 36
max_fetched_documents: 24
max_tokens: 200000
max_estimated_cost_usd: 5.0
max_wall_clock_seconds: 180
prompt_versions:
  operationalize: v1
  disagreement: v1
