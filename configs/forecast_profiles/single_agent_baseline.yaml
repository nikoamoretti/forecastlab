id: single_agent_baseline
version: 1
label: Single-agent baseline
description: One agent with a comparable evidence budget. Used as the evaluation baseline, not a handicapped straw man.
tracks:
  - single_agent
subquestions_per_track: 4
search_results_per_subquestion: 3
fetches_per_subquestion: 2
aggregation_method: equal_weight_logit_shrinkage
shrinkage: 0.10
max_model_calls: 24
max_search_calls: 12
max_fetched_documents: 8
max_tokens: 120000
max_estimated_cost_usd: 3.0
max_wall_clock_seconds: 180
prompt_versions:
  operationalize: v1
